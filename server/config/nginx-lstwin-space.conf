# Unified MeetingNotesApp Web host for lstwin.space.
#
# This file is intentionally a deployment template. Apply it only after the
# lstwin.space DNS A/AAAA records and TLS certificate point at the Backend VPS.
# The old lstwin.space STT edge must be retired or moved before this host is
# enabled, otherwise the two services will compete for the same HTTPS endpoint.

server {
    listen 80;
    listen [::]:80;
    server_name lstwin.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://lstwin.space$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lstwin.space;

    ssl_certificate /etc/letsencrypt/live/lstwin.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lstwin.space/privkey.pem;

    client_max_body_size 1024m;

    # User Web: standard HTTPS Web application, built from pwa/ without PWA
    # manifests, service workers or install prompts.
    location = / {
        return 308 /app/;
    }

    location = /app {
        return 308 /app/;
    }

    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Admin Web: Backend dashboard with account, growth, payment and service
    # operations. Authentication is enforced by the Backend middleware.
    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Former Backend dashboard URL.
    location = /web {
        return 308 /admin/;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 660s;
        proxy_read_timeout 660s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /health {
        # Android uses the domain root /health for STT model discovery.
        proxy_pass http://127.0.0.1:8888/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Cloud STT is kept under an explicit namespace so the browser never
    # receives the private management surface of the STT service.
    location = /stt-cloud {
        return 308 /stt-cloud/;
    }

    location = /stt-cloud/ws/transcribe-stream {
        proxy_pass http://127.0.0.1:8888/ws/transcribe-stream;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /stt-cloud/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 14400s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        return 404;
    }

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
