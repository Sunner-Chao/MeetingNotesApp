<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>智悟本 本地 STT</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f7;
      --surface: #ffffff;
      --line: #dfe3e7;
      --text: #17202a;
      --muted: #68737d;
      --accent: #1677ff;
      --accent-soft: #eaf3ff;
      --ok: #16875d;
      --warn: #b46a00;
      --danger: #bd2c2c;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; letter-spacing: 0; }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.96);
    }
    .topbar {
      width: min(1180px, calc(100% - 32px));
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { min-width: 0; }
    .brand h1 { margin: 0; font-size: 20px; font-weight: 650; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; align-items: center; gap: 10px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa3aa; }
    .status.ok .dot { background: var(--ok); }
    .status.error .dot { background: var(--danger); }
    .button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 14px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .button:hover { border-color: #aeb6bd; background: #fafbfc; }
    .button:disabled { opacity: .55; cursor: wait; }
    .button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    main { width: min(1180px, calc(100% - 32px)); margin: 24px auto 48px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .metric, .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .metric { min-height: 108px; padding: 17px; }
    .metric span { display: block; color: var(--muted); font-size: 13px; }
    .metric strong { display: block; margin-top: 12px; font-size: 24px; font-weight: 650; overflow-wrap: anywhere; }
    .metric small { display: block; margin-top: 7px; color: var(--muted); }
    .section { margin-top: 22px; }
    .section-head {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .section-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .section-head span { color: var(--muted); font-size: 13px; }
    .two-column { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr); gap: 12px; }
    .panel { padding: 18px; min-width: 0; }
    .panel-title { margin: 0 0 15px; font-size: 14px; font-weight: 650; }
    .details { margin: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); }
    .details div { display: contents; }
    .details dt, .details dd { margin: 0; padding: 10px 0; border-top: 1px solid #edf0f2; font-size: 13px; }
    .details div:first-child dt, .details div:first-child dd { border-top: 0; padding-top: 0; }
    .details dt { color: var(--muted); }
    .details dd { overflow-wrap: anywhere; }
    .segmented { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
    .segmented button { min-height: 42px; border: 0; background: #fff; color: var(--text); cursor: pointer; }
    .segmented button + button { border-left: 1px solid var(--line); }
    .segmented button.active { background: var(--accent-soft); color: #075ec7; font-weight: 650; }
    .switch-note { min-height: 38px; margin: 14px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .code {
      min-height: 260px;
      max-height: 430px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      border: 1px solid #29333d;
      border-radius: 6px;
      background: #111820;
      color: #d8e1e8;
      font: 12px/1.55 Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
    #toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: min(380px, calc(100% - 40px));
      padding: 11px 14px;
      border-radius: 6px;
      background: #17202a;
      color: #fff;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .16s ease;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { background: var(--danger); }
    @media (max-width: 820px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two-column { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; padding: 13px 0; }
      .toolbar { flex-direction: column-reverse; align-items: flex-end; }
    }
    @media (max-width: 520px) {
      .topbar, main { width: min(100% - 20px, 1180px); }
      .metrics { grid-template-columns: 1fr; }
      .metric { min-height: 92px; }
      .details { grid-template-columns: 112px minmax(0, 1fr); }
      .brand p { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <h1>智悟本 本地 STT</h1>
        <p>lstwin.space</p>
      </div>
      <div class="toolbar">
        <span id="service-status" class="status"><i class="dot"></i><span>连接中</span></span>
        <button id="refresh-button" class="button" type="button">刷新</button>
      </div>
    </div>
  </header>

  <main>
    <div class="metrics">
      <article class="metric"><span>服务</span><strong id="metric-service">-</strong><small id="metric-version">-</small></article>
      <article class="metric"><span>当前模型</span><strong id="metric-model">-</strong><small id="metric-device">-</small></article>
      <article class="metric"><span>推理队列</span><strong id="metric-queue">-</strong><small id="metric-completed">-</small></article>
      <article class="metric"><span>实时会话</span><strong id="metric-streams">-</strong><small id="metric-stream-limit">-</small></article>
    </div>

    <section class="section">
      <div class="section-head"><h2>运行状态</h2><span id="last-refresh">-</span></div>
      <div class="two-column">
        <article class="panel">
          <h3 class="panel-title">本机节点</h3>
          <dl class="details">
            <div><dt>模型来源</dt><dd id="detail-model-source">-</dd></div>
            <div><dt>模型目录</dt><dd id="detail-model-root">-</dd></div>
            <div><dt>最终稿</dt><dd id="detail-final">-</dd></div>
            <div><dt>长音频</dt><dd id="detail-long-audio">-</dd></div>
            <div><dt>音频归档</dt><dd id="detail-archive">-</dd></div>
          </dl>
        </article>
        <article class="panel">
          <h3 class="panel-title">模型切换</h3>
          <div class="segmented" role="group" aria-label="STT 模型">
            <button id="model-faster" type="button">Faster-Whisper · large-v3-turbo</button>
          </div>
          <p id="switch-note" class="switch-note">本地默认模型</p>
        </article>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>实时事件</h2>
        <label class="toggle"><input id="auto-refresh" type="checkbox" checked>自动刷新</label>
      </div>
      <pre id="events" class="code">加载中...</pre>
    </section>

    <section class="section">
      <div class="section-head"><h2>服务日志</h2><span>最近 160 行</span></div>
      <pre id="logs" class="code">加载中...</pre>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const state = { timer: null, switching: false };
    const byId = id => document.getElementById(id);

    function showToast(message, isError = false) {
      const toast = byId('toast');
      toast.textContent = String(message);
      toast.className = isError ? 'show error' : 'show';
      window.setTimeout(() => { toast.className = ''; }, 3200);
    }

    async function requestJson(url, options) {
      const response = await fetch(url, { credentials: 'same-origin', ...options });
      let payload = {};
      try { payload = await response.json(); } catch (_) { /* empty */ }
      if (!response.ok) throw new Error(payload.detail || `HTTP ${response.status}`);
      return payload;
    }

    function setStatus(ok, label) {
      const node = byId('service-status');
      node.className = `status ${ok ? 'ok' : 'error'}`;
      node.querySelector('span').textContent = label;
    }

    function renderStatus(data) {
      const inference = data.inference || {};
      const streams = data.streams || {};
      const finalConfig = data.final_transcription || {};
      const longAudio = data.long_audio || {};
      const archive = data.audio_archive || {};
      const ready = Boolean(data.model_loaded && streams.preview_model_loaded);
      setStatus(ready, ready ? '运行正常' : '模型异常');
      byId('metric-service').textContent = ready ? '正常' : '异常';
      byId('metric-version').textContent = `版本 ${data.version || '-'}`;
      byId('metric-model').textContent = data.model || '-';
      byId('metric-device').textContent = `${data.engine || '-'} · ${data.device || '-'}`;
      byId('metric-queue').textContent = `${inference.queued || 0} / ${inference.active || 0}`;
      byId('metric-completed').textContent = `等待 / 运行 · 完成 ${inference.completed || 0}`;
      byId('metric-streams').textContent = String(streams.active || 0);
      byId('metric-stream-limit').textContent = `上限 ${streams.max || 0}`;
      byId('detail-model-source').textContent = data.model_source || '-';
      byId('detail-model-root').textContent = data.model_root || '-';
      byId('detail-final').textContent = `beam ${finalConfig.beam_size || '-'} · batch ${finalConfig.batch_size || '-'}`;
      byId('detail-long-audio').textContent = `${Math.round((longAudio.chunk_seconds || 0) / 60)} 分钟分段 · ${longAudio.chunk_overlap_sec || 0} 秒重叠`;
      byId('detail-archive').textContent = archive.enabled ? `开启 · ${archive.retention_days || 0} 天` : '关闭';
      byId('model-faster').classList.toggle('active', data.engine === 'faster-whisper');
      byId('model-faster').textContent = `Faster-Whisper · ${data.model || 'large-v3-turbo'}`;
      byId('switch-note').textContent = data.model_error || `当前：${data.engine || '-'} / ${data.model || '-'}`;
      byId('last-refresh').textContent = new Date().toLocaleTimeString();
    }

    function renderEvents(payload) {
      const events = payload.events || [];
      byId('events').textContent = events.length
        ? events.map(event => JSON.stringify(event, null, 2)).join('\n\n')
        : '暂无实时事件';
    }

    function renderLogs(payload) {
      const lines = [
        ...(payload.stderr || []).map(line => `[SERVER] ${line}`),
        ...(payload.stdout || [])
      ];
      byId('logs').textContent = lines.length ? lines.join('\n') : '暂无日志';
    }

    async function refreshAll(silent = false) {
      const button = byId('refresh-button');
      button.disabled = true;
      try {
        const [status, events, logs] = await Promise.all([
          requestJson('/admin/api/status'),
          requestJson('/admin/api/events?limit=40'),
          requestJson('/admin/api/logs?limit=160')
        ]);
        renderStatus(status);
        renderEvents(events);
        renderLogs(logs);
      } catch (error) {
        setStatus(false, '连接失败');
        if (!silent) showToast(error.message, true);
      } finally {
        button.disabled = false;
      }
    }

    async function switchModel(engine, model) {
      if (state.switching) return;
      const accepted = window.confirm(`切换到 ${engine} / ${model}？`);
      if (!accepted) return;
      state.switching = true;
      byId('model-faster').disabled = true;
      byId('switch-note').textContent = '正在等待当前任务完成并切换模型...';
      try {
        await requestJson('/admin/api/stt/switch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ engine, model })
        });
        showToast('模型切换完成');
        await refreshAll(true);
      } catch (error) {
        showToast(error.message, true);
        byId('switch-note').textContent = `切换失败：${error.message}`;
      } finally {
        state.switching = false;
        byId('model-faster').disabled = false;
      }
    }

    byId('refresh-button').addEventListener('click', () => refreshAll());
    byId('model-faster').addEventListener('click', () => switchModel('faster-whisper', 'large-v3-turbo'));
    byId('auto-refresh').addEventListener('change', event => {
      window.clearInterval(state.timer);
      state.timer = event.target.checked ? window.setInterval(() => refreshAll(true), 5000) : null;
    });
    refreshAll();
    state.timer = window.setInterval(() => refreshAll(true), 5000);
  </script>
</body>
</html>
