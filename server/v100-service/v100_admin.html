<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智悟本 · V100 STT</title>
  <style>
    :root{color-scheme:light;--bg:#f5f6f7;--surface:#fff;--line:#dfe3e7;--text:#17202a;--muted:#68737d;--ok:#16875d;--bad:#bd2c2c;--accent:#1677ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.bar,main{width:min(1120px,calc(100% - 32px));margin:auto}.bar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand h1{font-size:20px;margin:0;font-weight:650}.brand p{font-size:13px;color:var(--muted);margin:3px 0 0}.actions{display:flex;align-items:center;gap:10px}.status{color:var(--muted);white-space:nowrap}.status:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa3aa;margin-right:7px}.status.ok:before{background:var(--ok)}.status.bad:before{background:var(--bad)}button{border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 14px;color:var(--text);cursor:pointer}button:hover{background:#fafbfc;border-color:#aeb6bd}main{padding:24px 0 48px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric,.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}.metric{padding:16px;min-height:100px}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:24px;margin-top:10px}.metric small{display:block;color:var(--muted);margin-top:5px}.section{margin-top:22px}.section-head{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px}.section-head h2{font-size:16px;margin:0}.section-head span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{padding:18px}.panel h3{font-size:14px;margin:0 0 12px}.details{display:grid;grid-template-columns:155px 1fr;margin:0}.details div{display:contents}.details dt,.details dd{border-top:1px solid #edf0f2;padding:9px 0;margin:0;overflow-wrap:anywhere}.details div:first-child dt,.details div:first-child dd{border-top:0;padding-top:0}.details dt{color:var(--muted)}pre{background:#111820;color:#d8e1e8;border:1px solid #29333d;border-radius:6px;min-height:220px;max-height:420px;overflow:auto;padding:14px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 Consolas,monospace}.note{color:var(--muted);font-size:13px;margin:0;line-height:1.6}.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #edf0f2;padding-top:12px;margin-top:12px}.switch strong{font-size:14px}.switch button{color:var(--muted);cursor:not-allowed}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.bar{width:min(100% - 20px,1120px)}main{width:min(100% - 20px,1120px)}.brand p{display:none}}@media(max-width:440px){.metrics{grid-template-columns:1fr}.actions{flex-direction:column;align-items:flex-end}}
  </style>
</head>
<body>
  <header><div class="bar"><div class="brand"><h1>智悟本 · V100 STT</h1><p>本地 GPU 语音服务管理</p></div><div class="actions"><span id="state" class="status">连接中</span><button id="refresh" type="button">刷新</button></div></div></header>
  <main>
    <div class="metrics"><article class="metric"><span>服务</span><strong id="service">-</strong><small id="version">-</small></article><article class="metric"><span>模型</span><strong id="model">-</strong><small id="device">-</small></article><article class="metric"><span>实时会话</span><strong id="streams">-</strong><small id="streamLimit">-</small></article><article class="metric"><span>推理调用</span><strong id="calls">-</strong><small id="files">文件请求 -</small></article></div>
    <section class="section"><div class="section-head"><h2>运行状态</h2><span id="updated">-</span></div><div class="grid"><article class="panel"><h3>V100 节点</h3><dl class="details"><div><dt>CUDA</dt><dd id="cuda">-</dd></div><div><dt>模型已加载</dt><dd id="loaded">-</dd></div><div><dt>说话人分离</dt><dd id="diar">-</dd></div><div><dt>音频增强</dt><dd id="enhance">-</dd></div><div><dt>公网入口</dt><dd>/stt-local</dd></div></dl></article><article class="panel"><h3>模型策略</h3><p class="note">实时预览与文件转写均使用 V100 上的 FunASR Paraformer。腾讯云由应用在本地链路失败时接管。</p><div class="switch"><strong>当前模型固定</strong><button type="button" disabled>部署配置管理</button></div><p class="note">运行中切换模型会中断实时会话，因此不提供在线切换。</p></article></div></section>
    <section class="section"><div class="section-head"><h2>实时事件</h2><span>最近 100 条</span></div><pre id="events">加载中...</pre></section>
    <section class="section"><div class="section-head"><h2>服务日志</h2><span>最近输出</span></div><pre id="logs">加载中...</pre></section>
  </main>
  <script>
    const $=id=>document.getElementById(id);let timer;
    async function get(url){const r=await fetch(url,{credentials:'same-origin'});let p={};try{p=await r.json()}catch(_){ }if(!r.ok)throw Error(p.detail||`HTTP ${r.status}`);return p}
    const yes=v=>v?'已启用':'未启用';
    function render(d){const ready=!!(d.model_loaded&&d.cuda);$('state').textContent=ready?'运行正常':'模型异常';$('state').className=`status ${ready?'ok':'bad'}`;$('service').textContent=ready?'正常':'异常';$('version').textContent=`${d.version||'-'}`;$('model').textContent=d.model||'-';$('device').textContent=`${d.engine||'-'} · ${d.device||'-'}`;$('streams').textContent=d.active_streams??'-';$('streamLimit').textContent=`上限 ${d.max_streams||2}`;$('calls').textContent=d.inference_calls??0;$('files').textContent=`文件请求 ${d.file_requests??0}`;$('cuda').textContent=yes(d.cuda);$('loaded').textContent=yes(d.model_loaded);const dia=d.diarization||{};$('diar').textContent=`${yes(dia.enabled)} · 模型 ${yes(dia.models_present)} · 已调用 ${yes(dia.active)}`;$('enhance').textContent=yes(d.audio_enhancement&&d.audio_enhancement.enabled);$('updated').textContent=new Date().toLocaleTimeString()}
    function renderEvents(d){$('events').textContent=(d.events||[]).length?d.events.map(x=>JSON.stringify(x,null,2)).join('\n\n'):'暂无实时事件'}
    function renderLogs(d){const lines=[...(d.stderr||[]).map(x=>`[SERVER] ${x}`),...(d.stdout||[])];$('logs').textContent=lines.length?lines.join('\n'):'暂无日志'}
    async function refresh(silent){try{const [s,e,l]=await Promise.all([get('/admin/api/status'),get('/admin/api/events?limit=100'),get('/admin/api/logs?limit=160')]);render(s);renderEvents(e);renderLogs(l)}catch(e){$('state').textContent='连接失败';$('state').className='status bad';if(!silent)alert(e.message)}}
    $('refresh').onclick=()=>refresh(false);refresh(false);timer=setInterval(()=>refresh(true),5000);
  </script>
</body>
</html>
